apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: stockrush
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: 185529490222.dkr.ecr.us-east-1.amazonaws.com/stockrush/notification-service:latest
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: NODE_ENV
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: REDIS_URL
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: GMAIL_APP_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"