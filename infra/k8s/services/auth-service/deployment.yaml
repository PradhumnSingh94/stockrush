apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: stockrush
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 185529490222.dkr.ecr.us-east-1.amazonaws.com/stockrush/auth-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: AUTH_DB_URL
            - name: PASETO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: PASETO_SECRET_KEY
            - name: PASETO_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: PASETO_PUBLIC_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10