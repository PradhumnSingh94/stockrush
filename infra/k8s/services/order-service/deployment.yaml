apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: stockrush
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 185529490222.dkr.ecr.us-east-1.amazonaws.com/stockrush/order-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: NODE_ENV
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: REDIS_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: PRODUCT_SERVICE_URL
            - name: PRODUCT_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: PRODUCT_GRPC_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: ORDER_DB_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10