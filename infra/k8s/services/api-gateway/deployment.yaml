apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: stockrush
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 185529490222.dkr.ecr.us-east-1.amazonaws.com/stockrush/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: NODE_ENV
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: PRODUCT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: ORDER_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: AUTH_SERVICE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: REDIS_URL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: stockrush-config
                  key: ALLOWED_ORIGINS
            - name: PASETO_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: stockrush-secrets
                  key: PASETO_PUBLIC_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10