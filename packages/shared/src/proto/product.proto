syntax = "proto3";

package product;

service ProductService {
  rpc GetProduct (ProductRequest) returns (ProductResponse) {}
  rpc DecrementStock (StockActionRequest) returns (StockActionResponse) {}
  rpc IncrementStock (StockActionRequest) returns (StockActionResponse) {}
}

message ProductRequest {
  string id = 1;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}

message StockActionRequest {
  string id = 1;
  int32 quantity = 2;
}

message StockActionResponse {
  bool success = 1;
  string message = 2;
}